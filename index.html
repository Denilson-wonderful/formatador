<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="denilsonpm, denilsonformatador">
    <title>Formatador de Links</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Formatador de Links</h1>

        <input
            type="text"
            id="link"
            placeholder="Cole o link aqui">

        <button onclick="formatar()">
            Formatar
        </button>

        <h2>Resultado</h2>

        <textarea id="resultado" readonly></textarea>
    </div>

    <script src="script.js"></script>
</body>
</html>
